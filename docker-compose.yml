version: '3.8'

services:
  nexahrm-ui:
    build: .
    container_name: nexahrm_ui
    command: python run_app.py
    ports:
      - "8502:8502"
    environment:
      - PORT=8502
    restart: unless-stopped

  nexahrm-api:
    build: .
    container_name: nexahrm_api
    command: python run_server.py
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
